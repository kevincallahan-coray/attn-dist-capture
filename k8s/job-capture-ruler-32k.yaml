apiVersion: batch/v1
kind: Job
metadata:
  name: attn-capture-ruler-32k
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values: ["45000"]
                  - key: nvidia.com/gpu.compute.major
                    operator: Gt
                    values: ["6"]
      initContainers:
        - name: prepare-dirs
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              # The PVC root is root-owned and the run container is uid 1000,
              # so a fresh top-level directory cannot be created by the job
              # user. Create and hand over our subtree only.
              mkdir -p /work/attn-dist
              chown -R 1000:1000 /work/attn-dist
              chmod -R u+rwX,g+rwX /work/attn-dist
              ls -ld /work /work/attn-dist
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: work
              mountPath: /work
        - name: clone
          image: alpine/git
          command: ["sh", "-c"]
          args:
            - git clone --depth 1 https://github.com/kevincallahan-coray/attn-dist-capture.git /repo
          volumeMounts:
            - name: repo
              mountPath: /repo
      containers:
        - name: run
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              cd /repo
              DATA_ROOT=/shared/ruler/data/32768_100
              OUT_ROOT=/work/attn-dist/ruler_32768
              mkdir -p "$OUT_ROOT"

              python -m venv /tmp/attn-venv
              source /tmp/attn-venv/bin/activate
              python -m pip install -q --upgrade pip
              python -m pip install -q torch --index-url https://download.pytorch.org/whl/cu128
              python -m pip install -q -r requirements.txt
              nvidia-smi

              # One dump per task: task identity is a real covariate for the
              # shape of the attention distribution, so keep them separable.
              for TASK in qa_1 qa_2 fwe niah_multivalue; do
                DATA="$DATA_ROOT/$TASK/validation.jsonl"
                test -f "$DATA"
                echo "=== capturing $TASK ==="
                python dump_attention.py \
                  --out-dir "$OUT_ROOT/$TASK" \
                  --dataset "$DATA" \
                  --max-input-tokens 32768 \
                  --max-examples 8 \
                  --max-new-tokens 64 \
                  --step-prob 0.25 \
                  --pairs-per-step 8 \
                  --save-v --v-fraction 0.1 \
                  --max-records 1200 \
                  --seed 1690
                python inspect_dump.py "$OUT_ROOT/$TASK" --check 128
              done

              echo "=== dump sizes ==="
              du -sh "$OUT_ROOT"/*
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_HOME
              value: /work/santa-adaptive-z/hf
          resources:
            requests:
              cpu: "2"
              memory: 48Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 80Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: work
              mountPath: /work
            - name: shared
              mountPath: /shared
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: repo
          emptyDir: {}
        - name: work
          persistentVolumeClaim:
            claimName: kevin-workspace
        - name: shared
          persistentVolumeClaim:
            claimName: kevin-ruler-shared
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
