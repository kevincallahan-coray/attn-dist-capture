apiVersion: batch/v1
kind: Job
metadata:
  name: attn-capture-smoke
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      # No nodeAffinity: kevin-workspace is a rook-ceph-block (RWO) PVC and is
      # topology-pinned to one Ceph cluster. Adding GPU-label affinity on top of
      # that volume constraint can empty the candidate node set entirely.
      initContainers:
        - name: clone
          image: alpine/git
          command: ["sh", "-c"]
          args:
            - git clone --depth 1 https://github.com/kevincallahan-coray/attn-dist-capture.git /repo
          volumeMounts:
            - name: repo
              mountPath: /repo
      containers:
        - name: run
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              cd /repo
              OUT=/work/attn-dist/smoke_4k_synth
              mkdir -p "$OUT"

              python -m venv /tmp/attn-venv
              source /tmp/attn-venv/bin/activate
              python -m pip install -q --upgrade pip
              python -m pip install -q torch --index-url https://download.pytorch.org/whl/cu128
              python -m pip install -q -r requirements.txt
              nvidia-smi

              python dump_attention.py \
                --out-dir "$OUT" \
                --synthetic-tokens 4096 \
                --max-input-tokens 4096 \
                --max-examples 2 \
                --max-new-tokens 32 \
                --step-prob 0.5 \
                --pairs-per-step 8 \
                --save-v \
                --max-records 400 \
                --seed 1690

              python inspect_dump.py "$OUT" --check 64
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            # Reuse the Llama weights already cached by the SANTA jobs.
            - name: HF_HOME
              value: /work/santa-adaptive-z/hf
          resources:
            requests:
              cpu: "2"
              memory: 24Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: work
              mountPath: /work
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: repo
          emptyDir: {}
        - name: work
          persistentVolumeClaim:
            claimName: kevin-workspace
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
