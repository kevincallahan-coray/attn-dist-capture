apiVersion: batch/v1
kind: Job
metadata:
  name: attn-capture-smoke
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values: ["20000"]
                  - key: nvidia.com/gpu.compute.major
                    operator: Gt
                    values: ["6"]
      initContainers:
        - name: prepare-dirs
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              # The PVC root is root-owned and the run container is uid 1000,
              # so a fresh top-level directory cannot be created by the job
              # user. Create and hand over our subtree only.
              mkdir -p /work/attn-dist
              chown -R 1000:1000 /work/attn-dist
              chmod -R u+rwX,g+rwX /work/attn-dist
              ls -ld /work /work/attn-dist
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: work
              mountPath: /work
        - name: clone
          image: alpine/git
          command: ["sh", "-c"]
          args:
            - git clone --depth 1 https://github.com/kevincallahan-coray/attn-dist-capture.git /repo
          volumeMounts:
            - name: repo
              mountPath: /repo
      containers:
        - name: run
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              cd /repo
              OUT=/work/attn-dist/smoke_4k_synth
              mkdir -p "$OUT"

              python -m venv /tmp/attn-venv
              source /tmp/attn-venv/bin/activate
              python -m pip install -q --upgrade pip
              python -m pip install -q torch --index-url https://download.pytorch.org/whl/cu128
              python -m pip install -q -r requirements.txt
              nvidia-smi

              python dump_attention.py \
                --out-dir "$OUT" \
                --synthetic-tokens 4096 \
                --max-input-tokens 4096 \
                --max-examples 2 \
                --max-new-tokens 32 \
                --step-prob 0.5 \
                --pairs-per-step 8 \
                --save-v \
                --max-records 400 \
                --seed 1690

              python inspect_dump.py "$OUT" --check 64
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            # Reuse the Llama weights already cached by the SANTA jobs.
            - name: HF_HOME
              value: /work/santa-adaptive-z/hf
          resources:
            requests:
              cpu: "2"
              memory: 24Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: work
              mountPath: /work
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: repo
          emptyDir: {}
        - name: work
          persistentVolumeClaim:
            claimName: kevin-workspace
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
