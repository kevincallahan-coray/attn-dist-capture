# Package every table and figure and emit it as base64 on stdout, then exit.
#
# Why not kubectl cp: that needs a *running* pod, which would mean parking an
# idle container. The summary is small (CSVs plus a few PNGs), so streaming it
# through the job log is both smaller and policy-clean. The job refuses to emit
# anything over 8 MB rather than flooding the log.
apiVersion: batch/v1
kind: Job
metadata:
  name: attn-publish-results
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 900
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: publish
          image: python:3.11-slim
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              ROOT=/shared/attn-eval
              STAGE=/tmp/attn-results
              rm -rf "$STAGE"; mkdir -p "$STAGE"

              # tables and figures
              for D in "$ROOT"/summary_4096 "$ROOT"/summary_4096_rel; do
                [ -d "$D" ] || continue
                mkdir -p "$STAGE/$(basename "$D")"
                cp "$D"/* "$STAGE/$(basename "$D")"/ 2>/dev/null || true
              done
              # raw per-record rows, compressed, so re-slicing is possible locally
              mkdir -p "$STAGE/raw"
              for F in "$ROOT"/ruler_4096/*.jsonl; do
                [ -f "$F" ] || continue
                gzip -c "$F" > "$STAGE/raw/$(basename "$F").gz"
              done
              # capture manifests, so the results stay traceable to a run
              mkdir -p "$STAGE/manifests"
              for M in /shared/attn-dist/ruler_4096/*/manifest.json; do
                [ -f "$M" ] || continue
                cp "$M" "$STAGE/manifests/$(basename "$(dirname "$M")").json"
              done

              echo "=== contents ==="
              find "$STAGE" -type f -printf '%10s  %p\n' | sort -k2

              tar czf /tmp/attn-results.tar.gz -C /tmp attn-results
              SIZE=$(stat -c%s /tmp/attn-results.tar.gz)
              echo "=== archive: $SIZE bytes ==="
              if [ "$SIZE" -gt 8388608 ]; then
                echo "archive over 8 MB; drop raw/ and rerun, or use the export job"
                exit 1
              fi
              echo "-----BEGIN ATTN RESULTS-----"
              base64 -w 120 /tmp/attn-results.tar.gz
              echo "-----END ATTN RESULTS-----"
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "2", memory: 4Gi}
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: kevin-ruler-shared
