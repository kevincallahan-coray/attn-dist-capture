# Package a dump into a single tarball on the PVC, then exit.
apiVersion: batch/v1
kind: Job
metadata:
  name: attn-export-dump
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 3600
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: export
          image: python:3.11-slim
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              DUMP=ruler_4096
              cd /work/attn-dist
              test -d "$DUMP"
              tar czf "${DUMP}.tar.gz" "$DUMP"
              ls -lh "${DUMP}.tar.gz"
              echo "sha256:"; sha256sum "${DUMP}.tar.gz"
          resources:
            requests: {cpu: "1", memory: 4Gi}
            limits: {cpu: "2", memory: 8Gi}
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: kevin-workspace
