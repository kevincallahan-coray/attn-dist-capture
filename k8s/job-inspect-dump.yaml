# Inspect dumps on the PVC: validate, print stats, exit.
# No idle process; NRP prohibits sleeping/parked pods.
apiVersion: batch/v1
kind: Job
metadata:
  name: attn-inspect-dump
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 1800
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-dirs
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /work/attn-dist
              chown -R 1000:1000 /work/attn-dist
              chmod -R u+rwX,g+rwX /work/attn-dist
              ls -ld /work /work/attn-dist
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: work
              mountPath: /work
        - name: clone
          image: alpine/git
          command: ["sh", "-c"]
          args:
            - git clone --depth 1 https://github.com/kevincallahan-coray/attn-dist-capture.git /repo
          volumeMounts:
            - name: repo
              mountPath: /repo
      containers:
        - name: inspect
          image: python:3.11-slim
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              pip install -q "numpy<2"
              cd /repo
              echo "=== dumps present ==="
              du -sh /work/attn-dist/* 2>/dev/null || echo "none yet"
              for D in /work/attn-dist/*/*; do
                test -f "$D/index.jsonl" || continue
                echo; echo "=== $D ==="
                python inspect_dump.py "$D" --check 128
              done
          resources:
            requests: {cpu: "1", memory: 4Gi}
            limits: {cpu: "2", memory: 8Gi}
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: work
              mountPath: /work
      volumes:
        - name: repo
          emptyDir: {}
        - name: work
          persistentVolumeClaim:
            claimName: kevin-workspace
