# Parallel sampler evaluation: 8 pods = 4 RULER tasks x {CDF pass, MCMC pass}.
#
# Indexed completion mode gives each pod a JOB_COMPLETION_INDEX (0..7).
# Indices 0-3 run the CDF samplers (iid / systematic / stratified) on each task.
# Indices 4-7 run all four MCMC variants on each task, including the
# cost-matched extra budgets and a burn-in pass.
#
# Splitting the two families means the fast CDF results land in minutes instead
# of waiting behind the MCMC chains, and an MCMC failure cannot take the CDF
# results down with it.
#
# Reads and writes CephFS only, so this can run while a capture job holds the
# ReadWriteOnce workspace volume.
apiVersion: batch/v1
kind: Job
metadata:
  name: attn-eval-samplers
spec:
  completions: 8
  parallelism: 8
  completionMode: Indexed
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 14400
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: clone
          image: alpine/git
          command: ["sh", "-c"]
          args:
            - git clone --depth 1 https://github.com/kevincallahan-coray/attn-dist-capture.git /repo
          volumeMounts:
            - name: repo
              mountPath: /repo
      containers:
        - name: eval
          image: python:3.11-slim
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              TASKS=(qa_1 qa_2 fwe niah_multivalue)
              IDX=$JOB_COMPLETION_INDEX
              TASK="${TASKS[$((IDX % 4))]}"
              if [ "$IDX" -lt 4 ]; then FAMILY=cdf; else FAMILY=mcmc; fi
              echo "index=$IDX task=$TASK family=$FAMILY"

              pip install -q "numpy<2"
              cd /repo

              DUMP=/shared/attn-dist/ruler_4096/$TASK
              OUTDIR=/shared/attn-eval/ruler_4096
              test -d "$DUMP"
              mkdir -p "$OUTDIR"

              if [ "$FAMILY" = "cdf" ]; then
                python eval_samplers.py \
                  --dump "$DUMP" \
                  --out "$OUTDIR/${TASK}_cdf.jsonl" \
                  --samplers iid,systematic,stratified \
                  --budgets 4,8,16,32,64,128,256,512 \
                  --trials 32 \
                  --max-records 300 \
                  --stratify-balanced \
                  --orders natural,shuffled \
                  --seed "$IDX"
                wc -l "$OUTDIR/${TASK}_cdf.jsonl"
              else
                # Pass 1: all four variants, no burn-in, plus cost-matched
                # budgets. An MCMC step needs no CDF and no normalizing
                # constant, so at equal cost it buys far more steps than the
                # CDF samplers get. 1024 and 4096 are that steelman.
                python eval_samplers.py \
                  --dump "$DUMP" \
                  --out "$OUTDIR/${TASK}_mcmc.jsonl" \
                  --samplers mcmc_nn_glauber,mcmc_nn_metropolis,mcmc_uni_glauber,mcmc_uni_metropolis \
                  --budgets 4,8,16,32,64,128,256,512 \
                  --mcmc-extra-budgets 1024,4096 \
                  --trials 32 \
                  --max-records 300 \
                  --stratify-balanced \
                  --orders natural,shuffled \
                  --seed "$IDX"
                wc -l "$OUTDIR/${TASK}_mcmc.jsonl"

                # Pass 2: same chains with 10*S burn-in discarded, so
                # "you didn't let it converge" is answered in the data rather
                # than in an argument. Fewer records since it costs 11x.
                python eval_samplers.py \
                  --dump "$DUMP" \
                  --out "$OUTDIR/${TASK}_mcmc_burn.jsonl" \
                  --samplers mcmc_nn_glauber,mcmc_nn_metropolis,mcmc_uni_glauber,mcmc_uni_metropolis \
                  --budgets 4,8,16,32,64,128,256,512 \
                  --mcmc-burnin-mult 10 \
                  --trials 32 \
                  --max-records 120 \
                  --stratify-balanced \
                  --orders natural \
                  --seed "$IDX"
                wc -l "$OUTDIR/${TASK}_mcmc_burn.jsonl"

                # Pass 3: best possible start. Every chain begins at the
                # highest-probability token rather than a random one, with no
                # burn-in. An alternative to pass 2, not a complement.
                python eval_samplers.py \
                  --dump "$DUMP" \
                  --out "$OUTDIR/${TASK}_mcmc_argmax.jsonl" \
                  --samplers mcmc_nn_glauber,mcmc_nn_metropolis,mcmc_uni_glauber,mcmc_uni_metropolis \
                  --budgets 4,8,16,32,64,128,256,512 \
                  --mcmc-extra-budgets 1024,4096 \
                  --mcmc-init argmax \
                  --trials 32 \
                  --max-records 300 \
                  --stratify-balanced \
                  --orders natural,shuffled \
                  --seed "$IDX"
                wc -l "$OUTDIR/${TASK}_mcmc_argmax.jsonl"
              fi
          resources:
            requests: {cpu: "2", memory: 8Gi}
            limits: {cpu: "4", memory: 16Gi}
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: shared
              mountPath: /shared
      volumes:
        - name: repo
          emptyDir: {}
        - name: shared
          persistentVolumeClaim:
            claimName: kevin-ruler-shared
